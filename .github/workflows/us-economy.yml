name: Refresh US economic observations
on:
  workflow_dispatch:
  schedule:
    - cron: '23 11,17,23 * * *'
permissions:
  contents: write
concurrency:
  group: gt-us-economy
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh_us_economy.py
      - name: Commit economic snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-economy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh US economic observations"
          git pull --rebase origin main
          git push
