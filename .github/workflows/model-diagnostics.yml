name: Historical model diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/model_diagnostics.cjs'
      - '.github/workflows/model-diagnostics.yml'
  schedule:
    - cron: '15 1 * * *'
permissions:
  contents: write
concurrency:
  group: gt-model-diagnostics
  cancel-in-progress: false
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculate retrospective diagnostics
        run: node scripts/model_diagnostics.cjs
      - name: Publish diagnostic summary
        run: |
          set -euo pipefail
          cp data/model-diagnostics.json "$RUNNER_TEMP/gt-model-diagnostics.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/gt-model-diagnostics.json" data/model-diagnostics.json
            git add data/model-diagnostics.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh historical model diagnostics"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
